<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nord Bau Centrum | Interactive 3D Room & Design Studio</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { orange: '#F97316', dark: '#070A0F', card: '#0F172A', border: '#1E293B' }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons & Three.js -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 0; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-brand-dark text-slate-100 h-full select-none">

    <!-- 3D Canvas Viewport -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div class="relative z-10 flex flex-col justify-between h-full pointer-events-none p-4 md:p-6">
        
        <!-- Top Navigation Bar -->
        <div class="flex justify-between items-center w-full pointer-events-auto">
            <div class="glass-panel px-4 py-2.5 rounded-2xl flex items-center gap-3 shadow-2xl">
                <a href="index.html" class="text-slate-300 hover:text-white text-xs font-bold flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-xl transition-all hover:bg-brand-orange">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>Zurück zur Website</span>
                </a>
                <div class="h-4 w-px bg-slate-700"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-brand-orange animate-pulse"></div>
                <div>
                    <span class="font-extrabold text-sm text-white block tracking-tight">NordBau Interactive 3D Planner</span>
                    <span class="text-[10px] text-brand-orange font-mono">Custom Room Design & Real-Photo Upload</span>
                </div>
            </div>

            <!-- Helper Notice -->
            <div class="glass-panel px-4 py-2 rounded-2xl text-xs text-slate-300 hidden md:flex items-center gap-2 shadow-xl">
                <i data-lucide="info" class="w-4 h-4 text-brand-orange"></i>
                <span>Fügen Sie Möbel hinzu und gestalten Sie den Raum nach Wunsch</span>
            </div>
        </div>

        <!-- Left Design & Tools Drawer -->
        <div class="absolute left-6 top-20 bottom-20 w-84 glass-panel rounded-3xl p-5 pointer-events-auto flex flex-col justify-between shadow-2xl z-20 border border-brand-orange/30 overflow-hidden">
            <div class="flex flex-col h-full">
                <!-- Header -->
                <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                    <div class="flex items-center gap-2">
                        <i data-lucide="layout" class="w-5 h-5 text-brand-orange"></i>
                        <h3 class="font-extrabold text-xs text-white uppercase tracking-wider">Raum & Design Studio</h3>
                    </div>
                    <span class="text-[10px] font-mono text-brand-orange bg-brand-orange/10 px-2 py-0.5 rounded">Live Planner</span>
                </div>

                <div class="space-y-4 overflow-y-auto custom-scrollbar pr-1 flex-1 text-xs">
                    
                    <!-- Section 1: Upload Client Real Room Photo -->
                    <div class="bg-gradient-to-br from-brand-orange/10 to-slate-900 p-3.5 rounded-2xl border border-brand-orange/40 space-y-2">
                        <label class="font-bold text-white block flex items-center gap-1.5">
                            <i data-lucide="camera" class="w-4 h-4 text-brand-orange"></i> Echten Raum fotografieren / hochladen
                        </label>
                        <p class="text-[10px] text-slate-400">Laden Sie ein Foto des Ist-Zustands hoch, um es als Arbeitsgrundlage zu nutzen:</p>
                        <label class="flex items-center justify-center w-full h-10 px-3 bg-slate-950 border border-slate-800 border-dashed rounded-xl cursor-pointer hover:border-brand-orange transition-all">
                            <span class="font-semibold text-[11px] text-slate-300">Foto auswählen (JPG/PNG)</span>
                            <input type="file" id="room-photo-upload" accept="image/*" class="hidden">
                        </label>
                    </div>

                    <!-- Section 2: Surface & Material Customizer -->
                    <div class="bg-slate-900/60 p-3 rounded-2xl border border-slate-800 space-y-2">
                        <label class="font-bold text-slate-400 block">1. Oberflächen & Materialien</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="setMaterial('wood')" class="p-2 bg-slate-950 hover:bg-slate-800 rounded-xl border border-slate-800 text-left transition-all">
                                <div class="w-full h-5 rounded bg-amber-800 mb-1"></div>
                                <span class="font-bold text-slate-200 block text-[11px]">Eichen-Parkett</span>
                            </button>
                            <button onclick="setMaterial('marble')" class="p-2 bg-slate-950 hover:bg-slate-800 rounded-xl border border-slate-800 text-left transition-all">
                                <div class="w-full h-5 rounded bg-slate-200 mb-1"></div>
                                <span class="font-bold text-slate-200 block text-[11px]">Carrara Marmor</span>
                            </button>
                            <button onclick="setMaterial('concrete')" class="p-2 bg-slate-950 hover:bg-slate-800 rounded-xl border border-slate-800 text-left transition-all">
                                <div class="w-full h-5 rounded bg-slate-600 mb-1"></div>
                                <span class="font-bold text-slate-200 block text-[11px]">Loft Beton</span>
                            </button>
                            <button onclick="setMaterial('brand')" class="p-2 bg-slate-950 hover:bg-slate-800 rounded-xl border border-slate-800 text-left transition-all">
                                <div class="w-full h-5 rounded bg-orange-600 mb-1"></div>
                                <span class="font-bold text-slate-200 block text-[11px]">NordBau Akzent</span>
                            </button>
                        </div>
                    </div>

                    <!-- Section 3: Add Furniture & Objects -->
                    <div class="bg-slate-900/60 p-3 rounded-2xl border border-slate-800 space-y-2">
                        <label class="font-bold text-slate-400 block">2. Möbel & Ausstattung</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="addFurniture('sofa')" class="py-2.5 px-3 bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-200 rounded-xl font-bold transition-all flex items-center justify-center gap-1.5">
                                <i data-lucide="sofa" class="w-4 h-4 text-brand-orange"></i> Sofa
                            </button>
                            <button onclick="addFurniture('table')" class="py-2.5 px-3 bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-200 rounded-xl font-bold transition-all flex items-center justify-center gap-1.5">
                                <i data-lucide="table" class="w-4 h-4 text-amber-400"></i> Tisch
                            </button>
                            <button onclick="addFurniture('plant')" class="py-2.5 px-3 bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-200 rounded-xl font-bold transition-all flex items-center justify-center gap-1.5">
                                <i data-lucide="flower-2" class="w-4 h-4 text-emerald-400"></i> Pflanze
                            </button>
                            <button onclick="addFurniture('lamp')" class="py-2.5 px-3 bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-200 rounded-xl font-bold transition-all flex items-center justify-center gap-1.5">
                                <i data-lucide="lamp" class="w-4 h-4 text-yellow-400"></i> Lampe
                            </button>
                        </div>
                        <button onclick="clearRoom()" class="mt-2 w-full py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 rounded-xl font-bold transition-all text-center">
                            Alles zurücksetzen
                        </button>
                    </div>

                </div>
            </div>
        </div>

        <!-- Center Bottom Toolbar -->
        <div class="self-center glass-panel px-4 py-2 rounded-2xl flex items-center gap-2 pointer-events-auto shadow-2xl mb-2 border border-slate-800">
            <button onclick="resetCamera()" class="p-2.5 rounded-xl text-slate-400 hover:text-white transition-all" title="Reset View"><i data-lucide="rotate-ccw" class="w-4 h-4"></i></button>
            <div class="w-px h-5 bg-slate-800 mx-1"></div>
            <a href="index.html#contact" class="px-4 py-2 bg-brand-orange hover:bg-orange-600 text-white font-bold rounded-xl text-xs transition-all shadow-lg flex items-center gap-2">
                <i data-lucide="send" class="w-3.5 h-3.5"></i> Eigenes Projekt anfragen
            </a>
        </div>
    </div>

    <!-- 3D Scene Script -->
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x070a0f);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 8, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Room Floor & Walls
        const floorGeo = new THREE.PlaneGeometry(8, 8);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.4 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const wallMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6 });
        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(8, 4), wallMat);
        backWall.position.set(0, 2, -4);
        scene.add(backWall);

        const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(8, 4), wallMat);
        leftWall.position.set(-4, 2, 0);
        leftWall.rotation.y = Math.PI / 2;
        scene.add(leftWall);

        // Furniture Storage
        const furnitureObjects = [];

        function setMaterial(type) {
            if (type === 'wood') floorMat.color.setHex(0x78350f);
            else if (type === 'marble') floorMat.color.setHex(0xe2e8f0);
            else if (type === 'concrete') floorMat.color.setHex(0x475569);
            else if (type === 'brand') floorMat.color.setHex(0xf97316);
            floorMat.needsUpdate = true;
        }

        function addFurniture(type) {
            let group = new THREE.Group();

            if (type === 'sofa') {
                const base = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.5, 0.9), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
                base.position.y = 0.25;
                const back = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 0.25), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
                back.position.set(0, 0.65, -0.32);
                group.add(base); group.add(back);
            } else if (type === 'table') {
                const top = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.08, 1.0), new THREE.MeshStandardMaterial({ color: 0xb45309 }));
                top.position.y = 0.8;
                [[-0.7, 0.4, -0.4], [0.7, 0.4, -0.4], [-0.7, 0.4, 0.4], [0.7, 0.4, 0.4]].forEach(pos => {
                    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.8), new THREE.MeshStandardMaterial({ color: 0x111827 }));
                    leg.position.set(...pos);
                    group.add(leg);
                });
                group.add(top);
            } else if (type === 'plant') {
                const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.18, 0.5), new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
                pot.position.y = 0.25;
                const leaves = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 12), new THREE.MeshStandardMaterial({ color: 0x10b981 }));
                leaves.position.y = 0.7;
                group.add(pot); group.add(leaves);
            } else if (type === 'lamp') {
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 2.5), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
                pole.position.y = 1.25;
                const shade = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.4, 16), new THREE.MeshStandardMaterial({ color: 0xf97316 }));
                shade.position.y = 2.4;
                group.add(pole); group.add(shade);
            }

            group.position.set((Math.random() - 0.5) * 3, 0, (Math.random() - 0.5) * 3);
            scene.add(group);
            furnitureObjects.push(group);
        }

        function clearRoom() {
            furnitureObjects.forEach(obj => scene.remove(obj));
            furnitureObjects.length = 0;
        }

        // Upload custom room photo and map it as background/floor
        const textureLoader = new THREE.TextureLoader();
        document.getElementById('room-photo-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    textureLoader.load(evt.target.result, (tex) => {
                        scene.background = tex; // Set uploaded room photo as 360/environment background
                    });
                };
                reader.readAsDataURL(file);
            }
        });

        function resetCamera() {
            camera.position.set(10, 8, 12);
            controls.target.set(0, 0, 0);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        lucide.createIcons();
    </script>
</body>
</html>
