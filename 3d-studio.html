<!DOCTYPE html>
<html lang="de" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nord Bau Centrum | 3D Interactive Studio</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { orange: '#F97316', dark: '#070A0F', card: '#0F172A' }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons & Three.js -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 0; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(249, 115, 22, 0.2);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full select-none">

    <div id="canvas-container"></div>

    <div class="relative z-10 flex flex-col justify-between h-full pointer-events-none p-5">
        <!-- Top Bar -->
        <div class="flex justify-between items-center w-full pointer-events-auto">
            <div class="glass-panel px-4 py-2 rounded-2xl flex items-center gap-3 shadow-2xl">
                <a href="index.html" class="text-slate-400 hover:text-white text-xs font-bold flex items-center gap-1.5 mr-2">
                    <i data-lucide="arrow-left" class="w-4 h-4"><span>Zurück</span></i>
                </a>
                <div class="w-2.5 h-2.5 rounded-full bg-brand-orange animate-pulse"></div>
                <span class="font-extrabold text-sm text-white">NordBau 3D Studio</span>
            </div>
        </div>

        <!-- Center Toolbar -->
        <div class="self-center glass-panel px-3 py-2 rounded-2xl flex items-center gap-2 pointer-events-auto shadow-2xl mb-2">
            <button id="btn-mode-solid" class="p-2.5 rounded-xl text-brand-orange bg-slate-800 transition-all" title="Licht Ein/Aus"><i data-lucide="sun" class="w-4 h-4"></i></button>
            <button id="btn-mode-wireframe" class="p-2.5 rounded-xl text-slate-400 hover:text-white transition-all" title="Wireframe"><i data-lucide="grid" class="w-4 h-4"></i></button>
            <button id="btn-cutaway" class="p-2.5 rounded-xl text-slate-400 hover:text-emerald-400 transition-all" title="Ausblenden"><i data-lucide="scissors" class="w-4 h-4"></i></button>
            <button id="btn-reset" class="p-2.5 rounded-xl text-slate-400 hover:text-white transition-all" title="Reset"><i data-lucide="rotate-ccw" class="w-4 h-4"></i></button>
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x070a0f);

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(11, 8.5, 13);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xf97316, 0.5));
        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(14, 20, 10);
        scene.add(light);
        scene.add(new THREE.GridHelper(30, 30, 0xf97316, 0x1e293b));

        const bimObjects = [];
        const mat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 });
        const orangeMat = new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.3 });

        function addMesh(geo, m, pos) {
            const mesh = new THREE.Mesh(geo, m);
            mesh.position.set(...pos);
            scene.add(mesh);
            bimObjects.push(mesh);
        }

        addMesh(new THREE.BoxGeometry(8, 0.2, 8), mat, [0, 0, 0]);
        [[-3.6, 1.5, -3.6], [3.6, 1.5, -3.6], [-3.6, 1.5, 3.6], [3.6, 1.5, 3.6]].forEach(pos => {
            addMesh(new THREE.BoxGeometry(0.4, 3, 0.4), orangeMat.clone(), pos);
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            camera.position.set(11, 8.5, 13);
            controls.target.set(0, 0, 0);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        lucide.createIcons();
    </script>
</body>
</html>
