<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nord Bau Centrum | Interactive 3D Showcase</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { orange: '#F97316', dark: '#070A0F', card: '#0F172A', border: '#1E293B' }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #070A0F; font-family: ui-sans-serif, system-ui, sans-serif; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-brand-dark text-slate-100 h-full select-none">

    <!-- Top Navigation Bar Overlay -->
    <div class="absolute top-4 left-4 right-4 z-20 flex justify-between items-center pointer-events-none">
        <div class="glass-panel px-4 py-2.5 rounded-2xl flex items-center gap-3 shadow-2xl pointer-events-auto">
            <a href="index.html" class="text-slate-300 hover:text-white text-xs font-bold flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-xl transition-all hover:bg-brand-orange">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Zurück zur Website</span>
            </a>
            <div class="h-4 w-px bg-slate-700"></div>
            <div class="w-2.5 h-2.5 rounded-full bg-brand-orange animate-pulse"></div>
            <div>
                <span class="font-extrabold text-sm text-white block tracking-tight">NordBau 3D Showcase</span>
                <span class="text-[10px] text-brand-orange font-mono">Photorealistic Virtual Walkthrough</span>
            </div>
        </div>

        <div class="glass-panel px-4 py-2 rounded-2xl text-xs text-slate-300 hidden md:flex items-center gap-2 shadow-xl pointer-events-auto">
            <i data-lucide="compass" class="w-4 h-4 text-brand-orange"></i>
            <span>Interaktive 360°-Rundgang: Nutzen Sie die Maus zur Navigation</span>
        </div>
    </div>

    <!-- Photorealistic 3D Virtual Tour Viewer (Sketchfab Engine) -->
    <div class="w-full h-full relative z-10">
        <iframe 
            title="NordBau Modern Luxury Apartment 3D Showcase" 
            class="w-full h-full border-0" 
            src="https://sketchfab.com/models/ee3d83ee66cb47d995c61a1532f7aa53/embed?autostart=1&cardboard=0&ui_controls=1&ui_infos=0&ui_inspector=0&ui_stop=0&ui_watermark=0&ui_watermark_link=0"
            allow="autoplay; fullscreen; xr-spatial-tracking" 
            execution-while-out-of-viewport 
            execution-while-not-rendered 
            web-share>
        </iframe>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
