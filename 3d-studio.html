<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nord Bau Centrum | Pro 3D Interior & Room Planner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { orange: '#F97316', dark: '#070A0F', card: '#0F172A', border: '#1E293B' }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons & Three.js -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 0; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-brand-dark text-slate-100 h-full select-none">

    <!-- 3D Canvas Viewport -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div class="relative z-10 flex flex-col justify-between h-full pointer-events-none p-4 md:p-6">
        
        <!-- Top App Bar -->
        <div class="flex justify-between items-center w-full pointer-events-auto">
            <div class="glass-panel px-4 py-2.5 rounded-2xl flex items-center gap-3 shadow-2xl">
                <a href="index.html" class="text-slate-300 hover:text-white text-xs font-bold flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-xl transition-all hover:bg-brand-orange">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>Exit Studio</span>
                </a>
                <div class="h-4 w-px bg-slate-700"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-brand-orange animate-pulse"></div>
                <div>
                    <span class="font-extrabold text-sm text-white block tracking-tight">NordBau Pro Planner</span>
                    <span class="text-[10px] text-brand-orange font-mono">Interactive BIM & Interior Studio</span>
                </div>
            </div>

            <!-- Room Presets Switcher -->
            <div class="glass-panel p-1.5 rounded-2xl hidden md:flex items-center gap-1 shadow-xl">
                <button onclick="switchRoom('bathroom')" id="room-btn-bathroom" class="px-3 py-1.5 text-xs font-bold rounded-xl bg-brand-orange text-white transition-all">Luxury Bath</button>
                <button onclick="switchRoom('living')" id="room-btn-living" class="px-3 py-1.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition-all">Living Room</button>
                <button onclick="switchRoom('kitchen')" id="room-btn-kitchen" class="px-3 py-1.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition-all">Modern Kitchen</button>
            </div>
        </div>

        <!-- Left Interactive Tool Drawer -->
        <div class="absolute left-6 top-20 bottom-20 w-80 glass-panel rounded-3xl p-5 pointer-events-auto flex flex-col justify-between shadow-2xl z-20 border border-brand-orange/20 overflow-hidden">
            <div class="flex flex-col h-full">
                <!-- Header -->
                <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                    <div class="flex items-center gap-2">
                        <i data-lucide="layout-dashboard" class="w-5 h-5 text-brand-orange"></i>
                        <h3 class="font-extrabold text-xs text-white uppercase tracking-wider">Design & Materials</h3>
                    </div>
                </div>

                <div class="space-y-4 overflow-y-auto custom-scrollbar pr-1 flex-1 text-xs">
                    
                    <!-- Section 1: Target Surface -->
                    <div class="bg-slate-900/60 p-3 rounded-2xl border border-slate-800">
                        <label class="font-bold text-slate-400 block mb-2">1. Select Target Surface</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button id="target-floor" onclick="setTarget('floor')" class="py-2 px-2 rounded-xl font-bold bg-brand-orange text-white transition-all">Floor Surface</button>
                            <button id="target-wall" onclick="setTarget('wall')" class="py-2 px-2 rounded-xl font-bold bg-slate-800 text-slate-400 hover:text-white transition-all">Wall Surface</button>
                        </div>
                    </div>

                    <!-- Section 2: Tile & Material Presets -->
                    <div class="bg-slate-900/60 p-3 rounded-2xl border border-slate-800">
                        <label class="font-bold text-slate-400 block mb-2">2. Professional Textures</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="applyTexture('marble')" class="p-2 bg-slate-950 rounded-xl border border-slate-800 hover:border-brand-orange text-left group">
                                <div class="w-full h-6 rounded bg-slate-200 mb-1"></div>
                                <span class="font-bold text-slate-200 group-hover:text-brand-orange block">Carrara Marble</span>
                            </button>
                            <button onclick="applyTexture('wood')" class="p-2 bg-slate-950 rounded-xl border border-slate-800 hover:border-brand-orange text-left group">
                                <div class="w-full h-6 rounded bg-amber-800 mb-1"></div>
                                <span class="font-bold text-slate-200 group-hover:text-brand-orange block">Natural Oak</span>
                            </button>
                            <button onclick="applyTexture('concrete')" class="p-2 bg-slate-950 rounded-xl border border-slate-800 hover:border-brand-orange text-left group">
                                <div class="w-full h-6 rounded bg-slate-700 mb-1"></div>
                                <span class="font-bold text-slate-200 group-hover:text-brand-orange block">Industrial Loft</span>
                            </button>
                            <button onclick="applyTexture('brand')" class="p-2 bg-slate-950 rounded-xl border border-slate-800 hover:border-brand-orange text-left group">
                                <div class="w-full h-6 rounded bg-orange-600 mb-1"></div>
                                <span class="font-bold text-slate-200 group-hover:text-brand-orange block">NordBau Accent</span>
                            </button>
                        </div>
                    </div>

                    <!-- Section 3: Add Furniture & Elements -->
                    <div class="bg-slate-900/60 p-3 rounded-2xl border border-slate-800">
                        <label class="font-bold text-slate-400 block mb-2">3. Add Room Elements</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="addElement('sofa')" class="py-2.5 px-3 bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-200 rounded-xl font-bold transition-all flex items-center justify-center gap-1.5">
                                <i data-lucide="sofa" class="w-4 h-4 text-brand-orange"></i> Add Sofa
                            </button>
                            <button onclick="addElement('plant')" class="py-2.5 px-3 bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-200 rounded-xl font-bold transition-all flex items-center justify-center gap-1.5">
                                <i data-lucide="flower-2" class="w-4 h-4 text-emerald-400"></i> Add Plant
                            </button>
                            <button onclick="addElement('wall')" class="py-2.5 px-3 bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-200 rounded-xl font-bold transition-all col-span-2 flex items-center justify-center gap-1.5">
                                <i data-lucide="square" class="w-4 h-4 text-cyan-400"></i> Build Divider Wall
                            </button>
                        </div>
                    </div>

                    <!-- Section 4: Custom Upload -->
                    <div class="bg-gradient-to-br from-slate-900 to-brand-card p-3 rounded-2xl border border-brand-orange/30">
                        <label class="font-bold text-white block mb-1 flex items-center gap-1.5">
                            <i data-lucide="upload" class="w-3.5 h-3.5 text-brand-orange"></i> Custom Texture Upload
                        </label>
                        <p class="text-[10px] text-slate-400 mb-2">Upload tile sample image (JPG/PNG):</p>
                        <label class="flex items-center justify-center w-full h-12 px-3 bg-slate-950 border border-slate-800 border-dashed rounded-xl cursor-pointer hover:border-brand-orange transition-all">
                            <span class="font-semibold text-[11px] text-slate-300">Choose Image File</span>
                            <input type="file" id="custom-texture" accept="image/*" class="hidden">
                        </label>
                    </div>

                </div>
            </div>
        </div>

        <!-- Center Bottom Toolbar -->
        <div class="self-center glass-panel px-4 py-2 rounded-2xl flex items-center gap-2 pointer-events-auto shadow-2xl mb-2 border border-slate-800">
            <button onclick="toggleDayNight()" id="btn-light" class="p-2.5 rounded-xl text-brand-orange bg-slate-800/80 hover:bg-slate-700 transition-all" title="Day/Night Mode"><i data-lucide="sun" class="w-4 h-4"></i></button>
            <button onclick="clearSceneElements()" class="p-2.5 rounded-xl text-slate-400 hover:text-red-400 transition-all" title="Clear Added Elements"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            <div class="w-px h-5 bg-slate-800 mx-1"></div>
            <button onclick="resetCamera()" class="p-2.5 rounded-xl text-slate-400 hover:text-white transition-all" title="Reset View"><i data-lucide="rotate-ccw" class="w-4 h-4"></i></button>
        </div>
    </div>

    <!-- Advanced 3D Engine Script -->
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x070a0f);
        scene.fog = new THREE.FogExp2(0x070a0f, 0.025);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 9, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.02;

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1.3);
        mainLight.position.set(15, 20, 15);
        mainLight.castShadow = true;
        scene.add(mainLight);

        // Room Structures (Floor, Walls)
        const floorGeo = new THREE.PlaneGeometry(10, 10);
        const wallGeo = new THREE.PlaneGeometry(10, 5);

        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3 });
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 });

        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const backWall = new THREE.Mesh(wallGeo, wallMat);
        backWall.position.set(0, 2.5, -5);
        backWall.receiveShadow = true;
        scene.add(backWall);

        const leftWall = new THREE.Mesh(wallGeo, wallMat);
        leftWall.position.set(-5, 2.5, 0);
        leftWall.rotation.y = Math.PI / 2;
        leftWall.receiveShadow = true;
        scene.add(leftWall);

        // Dynamic Elements Group (Sofa, Plant, Extra Walls)
        const userElements = [];
        const dynamicGroup = new THREE.Group();
        scene.add(dynamicGroup);

        let activeTarget = 'floor'; // 'floor' or 'wall'

        function setTarget(target) {
            activeTarget = target;
            document.getElementById('target-floor').className = target === 'floor' ? "py-2 px-2 rounded-xl font-bold bg-brand-orange text-white transition-all" : "py-2 px-2 rounded-xl font-bold bg-slate-800 text-slate-400 hover:text-white transition-all";
            document.getElementById('target-wall').className = target === 'wall' ? "py-2 px-2 rounded-xl font-bold bg-brand-orange text-white transition-all" : "py-2 px-2 rounded-xl font-bold bg-slate-800 text-slate-400 hover:text-white transition-all";
        }

        // Apply Texture Presets
        function applyTexture(type) {
            let mat = activeTarget === 'floor' ? floorMat : wallMat;
            mat.map = null;

            if (type === 'marble') {
                mat.color.setHex(0xe2e8f0);
                mat.roughness = 0.1;
            } else if (type === 'wood') {
                mat.color.setHex(0x78350f);
                mat.roughness = 0.6;
            } else if (type === 'concrete') {
                mat.color.setHex(0x475569);
                mat.roughness = 0.4;
            } else if (type === 'brand') {
                mat.color.setHex(0xf97316);
                mat.roughness = 0.3;
            }
            mat.needsUpdate = true;
        }

        // Custom Texture Upload
        const textureLoader = new THREE.TextureLoader();
        document.getElementById('custom-texture').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    textureLoader.load(evt.target.result, (tex) => {
                        tex.wrapS = THREE.RepeatWrapping;
                        tex.wrapT = THREE.RepeatWrapping;
                        tex.repeat.set(4, 4);
                        let mat = activeTarget === 'floor' ? floorMat : wallMat;
                        mat.map = tex;
                        mat.color.setHex(0xffffff);
                        mat.needsUpdate = true;
                    });
                };
                reader.readAsDataURL(file);
            }
        });

        // Add Room Elements dynamically
        function addElement(type) {
            let mesh;
            if (type === 'sofa') {
                const sofaGroup = new THREE.Group();
                const base = new THREE.Mesh(new THREE.BoxGeometry(3, 0.8, 1.2), new THREE.MeshStandardMaterial({ color: 0x334155 }));
                base.position.y = 0.4;
                base.castShadow = true;
                const back = new THREE.Mesh(new THREE.BoxGeometry(3, 1.2, 0.3), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
                back.position.set(0, 1, -0.45);
                back.castShadow = true;
                sofaGroup.add(base);
                sofaGroup.add(back);
                sofaGroup.position.set((Math.random() - 0.5) * 4, 0, (Math.random() - 0.5) * 4);
                dynamicGroup.add(sofaGroup);
                userElements.push(sofaGroup);
            } else if (type === 'plant') {
                const plantGroup = new THREE.Group();
                const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.3, 0.8, 16), new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
                pot.position.y = 0.4;
                const leaves = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.3 }));
                leaves.position.y = 1.1;
                plantGroup.add(pot);
                plantGroup.add(leaves);
                plantGroup.position.set((Math.random() - 0.5) * 6, 0, (Math.random() - 0.5) * 6);
                dynamicGroup.add(plantGroup);
                userElements.push(plantGroup);
            } else if (type === 'wall') {
                const divider = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 0.3), wallMat);
                divider.position.set(0, 1.5, 0);
                divider.castShadow = true;
                dynamicGroup.add(divider);
                userElements.push(divider);
            }
        }

        function clearSceneElements() {
            userElements.forEach(el => dynamicGroup.remove(el));
            userElements.length = 0;
        }

        // Room Presets Switcher
        function switchRoom(roomType) {
            clearSceneElements();
            ['bathroom', 'living', 'kitchen'].forEach(r => {
                document.getElementById(`room-btn-${r}`).className = r === roomType ? "px-3 py-1.5 text-xs font-bold rounded-xl bg-brand-orange text-white transition-all" : "px-3 py-1.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition-all";
            });

            if (roomType === 'bathroom') {
                floorMat.color.setHex(0x1e293b);
                wallMat.color.setHex(0x334155);
            } else if (roomType === 'living') {
                floorMat.color.setHex(0x78350f); // Wood floor
                wallMat.color.setHex(0x64748b);
                addElement('sofa');
                addElement('plant');
            } else if (roomType === 'kitchen') {
                floorMat.color.setHex(0x0f172a);
                wallMat.color.setHex(0x475569);
            }
        }

        let isDay = true;
        function toggleDayNight() {
            isDay = !isDay;
            mainLight.intensity = isDay ? 1.3 : 0.2;
            ambientLight.intensity = isDay ? 0.6 : 0.2;
            scene.background.setHex(isDay ? 0x070a0f : 0x010204);
            document.getElementById('btn-light').className = isDay ? "p-2.5 rounded-xl text-brand-orange bg-slate-800/80 hover:bg-slate-700 transition-all" : "p-2.5 rounded-xl text-cyan-400 bg-slate-800/80 hover:bg-slate-700 transition-all";
        }

        function resetCamera() {
            camera.position.set(12, 9, 14);
            controls.target.set(0, 1, 0);
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        lucide.createIcons();
    </script>
</body>
</html>
