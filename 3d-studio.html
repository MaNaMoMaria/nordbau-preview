<!DOCTYPE html>
<html lang="de" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nord Bau Centrum | 3D Interactive Studio</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { orange: '#F97316', dark: '#070A0F', card: '#0F172A' }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons & Three.js -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 0; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(249, 115, 22, 0.25);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full select-none">

    <div id="canvas-container"></div>

    <div class="relative z-10 flex flex-col justify-between h-full pointer-events-none p-5">
        <!-- Top Bar -->
        <div class="flex justify-between items-center w-full pointer-events-auto">
            <div class="glass-panel px-4 py-2.5 rounded-2xl flex items-center gap-3 shadow-2xl">
                <a href="index.html" class="text-slate-300 hover:text-white text-xs font-bold flex items-center gap-1.5 mr-2 bg-slate-800/80 px-3 py-1.5 rounded-xl transition-all">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>Zurück zur Website</span>
                </a>
                <div class="w-2.5 h-2.5 rounded-full bg-brand-orange animate-pulse"></div>
                <span class="font-extrabold text-sm text-white">NordBau 3D Studio</span>
            </div>
            
            <div class="glass-panel px-4 py-2 rounded-2xl text-xs text-slate-300 hidden sm:block">
                <span>💡 راهنما: روی هر قطعه کلیک کنید تا انتخاب شود</span>
            </div>
        </div>

        <!-- Center Toolbar (Fully Functional) -->
        <div class="self-center glass-panel px-3 py-2 rounded-2xl flex items-center gap-2 pointer-events-auto shadow-2xl mb-2 border border-brand-orange/30">
            <button id="btn-mode-solid" class="p-2.5 rounded-xl text-brand-orange bg-slate-800 transition-all hover:bg-slate-700" title="روشن/خاموش کردن نور پردازی"><i data-lucide="sun" class="w-4 h-4"></i></button>
            <button id="btn-mode-wireframe" class="p-2.5 rounded-xl text-slate-300 hover:text-white transition-all hover:bg-slate-800" title="حالت شبکه سیمانی (Wireframe)"><i data-lucide="grid" class="w-4 h-4"></i></button>
            <button id="btn-cutaway" class="p-2.5 rounded-xl text-slate-300 hover:text-emerald-400 transition-all hover:bg-slate-800" title="مخفی کردن قطعه انتخاب شده"><i data-lucide="scissors" class="w-4 h-4"></i></button>
            <button id="btn-reset" class="p-2.5 rounded-xl text-slate-300 hover:text-white transition-all hover:bg-slate-800" title="بازنشانی دوربین و نمایش همه"><i data-lucide="rotate-ccw" class="w-4 h-4"></i></button>
        </div>
    </div>

    <!-- 3D Studio Logic -->
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x070a0f);
        scene.fog = new THREE.FogExp2(0x070a0f, 0.03);

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 9, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 1, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xf97316, 1.5);
        mainLight.position.set(15, 25, 15);
        scene.add(mainLight);

        scene.add(new THREE.GridHelper(30, 30, 0xf97316, 0x1e293b));

        // BIM Structure Objects
        const bimObjects = [];
        const concreteMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.4 });
        const orangePillarMat = new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.2, metalness: 0.3 });
        const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.4, roughness: 0.1, transmission: 0.9 });

        function createMesh(geo, mat, pos, name) {
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(...pos);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { name: name };
            scene.add(mesh);
            bimObjects.push(mesh);
            return mesh;
        }

        // Foundation
        createMesh(new THREE.BoxGeometry(8, 0.3, 8), concreteMat, [0, 0, 0], "Fundamentplatte (بتن پایه)");
        
        // Columns
        const colGeo = new THREE.BoxGeometry(0.5, 3.2, 0.5);
        [[-3.5, 1.6, -3.5], [3.5, 1.6, -3.5], [-3.5, 1.6, 3.5], [3.5, 1.6, 3.5]].forEach((pos, i) => {
            createMesh(colGeo, orangePillarMat.clone(), pos, `Stütze C0${i+1} (ستون سازه)`);
        });

        // Walls & Glass
        createMesh(new THREE.BoxGeometry(7, 3, 0.2), glassMat, [0, 1.5, -3.6], "Glaswand (دیوار شیشه‌ای)");
        const roof = createMesh(new THREE.BoxGeometry(8, 0.3, 8), concreteMat.clone(), [0, 3.35, 0], "Dachdecke (سقف سازه)");

        // Raycasting for selection
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let selectedObj = null;

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('button') || e.target.closest('a')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(bimObjects.filter(o => o.visible));

            if (intersects.length > 0) {
                if (selectedObj && selectedObj.material.emissive) selectedObj.material.emissive.setHex(0x000000);
                selectedObj = intersects[0].object;
                if (selectedObj.material.emissive) selectedObj.material.emissive.setHex(0xf97316);
            }
        });

        // Buttons Logic
        let lightsOn = true;
        document.getElementById('btn-mode-solid').addEventListener('click', () => {
            lightsOn = !lightsOn;
            mainLight.intensity = lightsOn ? 1.5 : 0.1;
            ambientLight.intensity = lightsOn ? 0.6 : 0.2;
            document.getElementById('btn-mode-solid').classList.toggle('text-brand-orange', lightsOn);
        });

        let isWireframe = false;
        document.getElementById('btn-mode-wireframe').addEventListener('click', () => {
            isWireframe = !isWireframe;
            bimObjects.forEach(o => o.material.wireframe = isWireframe);
            document.getElementById('btn-mode-wireframe').classList.toggle('text-brand-orange', isWireframe);
        });

        document.getElementById('btn-cutaway').addEventListener('click', () => {
            if (selectedObj) {
                selectedObj.visible = false;
                selectedObj = null;
            } else {
                roof.visible = !roof.visible; // Toggle roof if nothing selected
            }
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            bimObjects.forEach(o => o.visible = true);
            camera.position.set(12, 9, 14);
            controls.target.set(0, 1, 0);
            if (selectedObj && selectedObj.material.emissive) selectedObj.material.emissive.setHex(0x000000);
            selectedObj = null;
        });

        // Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        lucide.createIcons();
    </script>
</body>
</html>
