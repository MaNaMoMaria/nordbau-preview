<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nord Bau Centrum | 360° Interactive Studio</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { orange: '#F97316', dark: '#070A0F', card: '#0F172A', border: '#1E293B' }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons & Three.js -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #070A0F; font-family: ui-sans-serif, system-ui, sans-serif; }
        #viewer-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 0; cursor: grab; }
        #viewer-container:active { cursor: grabbing; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(249, 115, 22, 0.25);
        }
    </style>
</head>
<body class="bg-brand-dark text-slate-100 h-full select-none">

    <!-- 360 Canvas Container -->
    <div id="viewer-container"></div>

    <!-- UI Overlay Layer -->
    <div class="relative z-10 flex flex-col justify-between h-full pointer-events-none p-4 md:p-6">
        
        <!-- Top App Bar -->
        <div class="flex justify-between items-center w-full pointer-events-auto">
            <div class="glass-panel px-4 py-2.5 rounded-2xl flex items-center gap-3 shadow-2xl">
                <a href="index.html" class="text-slate-300 hover:text-white text-xs font-bold flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-xl transition-all hover:bg-brand-orange">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>Zurück zur Website</span>
                </a>
                <div class="h-4 w-px bg-slate-700"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-brand-orange animate-pulse"></div>
                <div>
                    <span class="font-extrabold text-sm text-white block tracking-tight">NordBau 360° Studio</span>
                    <span class="text-[10px] text-brand-orange font-mono">Real-Time Interactive Panoramic View</span>
                </div>
            </div>

            <!-- Helper Hint -->
            <div class="glass-panel px-4 py-2 rounded-2xl text-xs text-slate-300 hidden md:flex items-center gap-2 shadow-xl">
                <i data-lucide="move" class="w-4 h-4 text-brand-orange"></i>
                <span>Click and drag mouse to explore the 360° space</span>
            </div>
        </div>

        <!-- Floating Controls Panel -->
        <div class="self-center glass-panel p-3 rounded-2xl flex items-center gap-3 pointer-events-auto shadow-2xl mb-4 border border-brand-orange/30">
            <span class="text-xs font-bold text-slate-400 pl-2">Spaces:</span>
            <button onclick="loadPanorama('bath')" id="btn-bath" class="px-4 py-2 rounded-xl text-xs font-bold bg-brand-orange text-white transition-all shadow-lg">
                Luxury Bathroom
            </button>
            <button onclick="loadPanorama('living')" id="btn-living" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:text-white transition-all">
                Modern Living Room
            </button>
            <div class="w-px h-6 bg-slate-800 mx-1"></div>
            <button id="btn-reset" class="p-2.5 bg-slate-800/80 hover:bg-slate-700 rounded-xl text-slate-300 hover:text-white transition-all" title="Reset View">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- 360 Panorama Three.js Script -->
    <script>
        const container = document.getElementById('viewer-container');

        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 0.1);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Create Sphere Geometry for 360 view
        const geometry = new THREE.SphereGeometry(500, 60, 40);
        geometry.scale(-1, 1, 1); // Invert sphere to render texture inside

        const textureLoader = new THREE.TextureLoader();
        
        // High quality panoramic texture images
        const scenes = {
            bath: 'https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&q=80&w=2000',
            living: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&q=80&w=2000'
        };

        const material = new THREE.MeshBasicMaterial();
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        function loadPanorama(key) {
            document.getElementById('btn-bath').className = key === 'bath' ? "px-4 py-2 rounded-xl text-xs font-bold bg-brand-orange text-white transition-all shadow-lg" : "px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:text-white transition-all";
            document.getElementById('btn-living').className = key === 'living' ? "px-4 py-2 rounded-xl text-xs font-bold bg-brand-orange text-white transition-all shadow-lg" : "px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:text-white transition-all";

            textureLoader.load(scenes[key], (texture) => {
                material.map = texture;
                material.needsUpdate = true;
            });
        }

        // Initial Load
        loadPanorama('bath');

        // Mouse Drag Interaction Controls
        let isUserInteracting = false, onPointerDownPointerX = 0, onPointerDownPointerY = 0;
        let lon = 0, onPointerDownLon = 0, lat = 0, onPointerDownLat = 0;
        let phi = 0, theta = 0;

        container.addEventListener('pointerdown', (e) => {
            isUserInteracting = true;
            onPointerDownPointerX = e.clientX;
            onPointerDownPointerY = e.clientY;
            onPointerDownLon = lon;
            onPointerDownLat = lat;
        });

        window.addEventListener('pointermove', (e) => {
            if (isUserInteracting === true) {
                lon = (onPointerDownPointerX - e.clientX) * 0.1 + onPointerDownLon;
                lat = (e.clientY - onPointerDownPointerY) * 0.1 + onPointerDownLat;
            }
        });

        window.addEventListener('pointerup', () => { isUserInteracting = false; });

        // Mouse Wheel Zooming
        container.addEventListener('wheel', (e) => {
            camera.fov += e.deltaY * 0.05;
            camera.fov = Math.max(30, Math.min(90, camera.fov));
            camera.updateProjectionMatrix();
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            lon = 0; lat = 0; camera.fov = 75;
            camera.updateProjectionMatrix();
        });

        function animate() {
            requestAnimationFrame(animate);

            lat = Math.max(-85, Math.min(85, lat));
            phi = THREE.MathUtils.degToRad(90 - lat);
            theta = THREE.MathUtils.degToRad(lon);

            camera.target = new THREE.Vector3(
                500 * Math.sin(phi) * Math.cos(theta),
                500 * Math.cos(phi),
                500 * Math.sin(phi) * Math.sin(theta)
            );
            camera.lookAt(camera.target);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        lucide.createIcons();
    </script>
</body>
</html>
